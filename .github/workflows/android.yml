name: Android build

on:
  push:
    paths: ["FlipperZeroMobile/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["FlipperZeroMobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FlipperZeroMobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK (pré-instalado no runner)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" || true
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: flipper-zero-mobile-debug-apk
          path: FlipperZeroMobile/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: FlipperZeroMobile/app/build/reports/tests/
      - name: Publicar APK como release (download direto)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-${GITHUB_SHA::7}"
          cp app/build/outputs/apk/debug/app-debug.apk "FlipperZeroMobile-debug-${GITHUB_SHA::7}.apk"
          gh release create "$TAG" "FlipperZeroMobile-debug-${GITHUB_SHA::7}.apk" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Flipper Zero Mobile (debug ${GITHUB_SHA::7})" \
            --notes "APK de debug gerado automaticamente pelo CI a partir do commit ${GITHUB_SHA}. Instale com adb install -r ou abrindo o arquivo no celular (Android 8.0+)."
